name: Dev deploy

on:
  push:
    branches:
      - development

jobs:
  deploy:
    name: 🎉 Deploy Dev
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 Install & Build Project (NPM)
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          npm install
          npm run build

      - name: 📂 Deploy to Server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: 'susantimegah'
          server: '163.61.58.29'
          port: 22
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: 'dist/*'
          remote_path: '/home/susantimegah/public_html/recruitment-dev.susantimegah.com/'
